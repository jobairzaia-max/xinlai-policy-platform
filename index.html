<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xinlai Finance SaaS - v1 启动版</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <h1>Xinlai Finance</h1>
        <p>国内财务公司 SaaS（v1）</p>
        <nav>
          <a href="#">仪表盘</a>
          <a href="#">账套管理</a>
          <a href="#">总账凭证</a>
          <a href="#">应收应付</a>
          <a href="#">收付款对账</a>
          <a href="#">审计日志</a>
        </nav>
      </aside>
      <main class="main">
        <header>
          <h2>生产级起步骨架</h2>
          <button id="newVoucherBtn">新建凭证（示例）</button>
        </header>
        <section class="cards" id="kpiCards"></section>
        <section class="panel">
          <h3>MVP 里程碑（90天）</h3>
          <ul>
            <li>0-30天：租户、账套、凭证、权限、审计日志</li>
            <li>31-60天：应收应付、收付款、银行流水导入对账</li>
            <li>61-90天：月结、反结账审批、监控告警、灰度上线</li>
          </ul>
        </section>
        <section class="panel">
          <h3>关键工程约束</h3>
          <ol>
            <li>采用复式记账，借贷必须平衡</li>
            <li>已过账凭证禁止直接修改，使用冲销</li>
            <li>所有业务单据可追溯到账务凭证</li>
            <li>多租户隔离默认 tenant_id + 数据权限</li>
          </ol>
        </section>
      </main>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
